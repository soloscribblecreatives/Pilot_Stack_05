<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>S.O.S — Join the dots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game" aria-label="Trace S, O, S in order. Join all the dots in each letter. Lift and resume anywhere.">
        <img id="background" src="assets/background.png" alt="Join the dots to join the mission. As we get ready to celebrate the festive season!" draggable="false">
        <canvas id="drawing" width="1080" height="810" aria-label="Letter tracing area">This game requires a browser with HTML5 canvas support.</canvas>
        <!-- Each letter-completion function displays its own replaceable PNG. -->
        <img id="s1Image" class="letter-complete" src="assets/s1.png" alt="S1 completed" draggable="false">
        <img id="o1Image" class="letter-complete" src="assets/o1.png" alt="O1 completed" draggable="false">
        <img id="s2Image" class="letter-complete" src="assets/s2.png" alt="S2 completed" draggable="false">
        <div id="prompt">TRACE. FILL. REVEAL.</div>
        <img id="thankYou" src="assets/thank-you.png" alt="Thank you for helping your patients" draggable="false">
        <img id="completionImage" src="assets/step-down-on-salt.png" alt="STEP DOWN ON SALT" draggable="false">
        <!-- Optional future video: set VIDEO_SOURCE in game.js. -->
        <video id="completionVideo" controls playsinline webkit-playsinline preload="none"></video>
        <button id="restart" type="button" aria-label="Restart game">Replay</button>
        <p id="status" class="screen-reader" aria-live="polite">Trace the first S. Join all its dots; lift and resume anywhere on the letter.</p>
    </main>
    <script src="completion.js"></script>
    <script src="game.js"></script>
</body>
</html>
